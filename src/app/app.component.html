<!DOCTYPE html>
<mat-toolbar color="primary" class="mat-elevation-z4">
  <span class="toolbar-title">myFlix</span>
</mat-toolbar>
<div class="main-page">
  <mat-card class="welcome-card mat-elevation-z4">
    <mat-card-title>Welcome to myFlix!</mat-card-title>
    <mat-card-content>
      <p>Discover and explore your favorite movies!</p>
    </mat-card-content>
    <mat-card-actions>
      <button
        mat-raised-button
        (click)="openUserRegistrationDialog()"
        color="accent"
        style="margin-right: 10px"
      >
        Sign Up
      </button>
      <button mat-raised-button (click)="openUserLoginDialog()" color="primary">
        Login
      </button>
    </mat-card-actions>
  </mat-card>
</div>
